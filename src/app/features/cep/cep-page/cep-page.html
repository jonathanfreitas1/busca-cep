<h1 class="cep-page__titulo">Busca de Endereços</h1>

<section class="cep-page__secao" aria-label="Buscar endereço">
  <app-busca-cep
    [buscando]="store.buscando()"
    [erro]="store.erroBusca()"
    (buscar)="store.buscarCep($event)"
  />
</section>

<!-- PROVISÓRIO (T12): substituído pela tabela do componente ListaBuscas na T14 -->
<section class="cep-page__secao" aria-labelledby="titulo-buscas">
  <h2 id="titulo-buscas">Buscas realizadas</h2>

  @if (store.erroHistorico(); as erro) {
    <p role="alert">{{ erro }}</p>
  }

  <ul>
    @for (busca of store.buscas(); track busca.id) {
      <li>{{ busca.cep }} — {{ busca.endereco.descricao }}</li>
    } @empty {
      <li>Nenhuma busca realizada.</li>
    }
  </ul>
</section>
