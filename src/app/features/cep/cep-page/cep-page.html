<h1 class="cep-page__titulo">Busca de Endereços</h1>

<!--
  Os h2 das seções ficam só para leitores de tela (a tela segue o wireframe):
  permitem navegar pelos títulos e dão nome às seções via aria-labelledby.
-->
<section class="cep-page__secao" aria-labelledby="titulo-busca">
  <h2 id="titulo-busca" class="visualmente-oculto">Buscar endereço</h2>
  <app-busca-cep
    [buscando]="store.buscando()"
    [erro]="store.erroBusca()"
    (buscar)="store.buscarCep($event)"
  />
</section>

<section class="cep-page__secao" aria-labelledby="titulo-historico">
  <h2 id="titulo-historico" class="visualmente-oculto">Histórico de buscas</h2>
  <app-lista-buscas
    [buscas]="store.buscas()"
    [carregando]="store.carregandoHistorico()"
    [erro]="store.erroHistorico()"
    [idBuscaNova]="store.idBuscaNova()"
    (remover)="store.remover($event)"
  />
</section>
