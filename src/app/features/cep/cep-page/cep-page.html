<h1 class="cep-page__titulo">Busca de Endereços</h1>

<section class="cep-page__secao" aria-label="Buscar endereço">
  <app-busca-cep
    [buscando]="store.buscando()"
    [erro]="store.erroBusca()"
    (buscar)="store.buscarCep($event)"
  />
</section>

<section class="cep-page__secao" aria-label="Histórico de buscas">
  <app-lista-buscas
    [buscas]="store.buscas()"
    [carregando]="store.carregandoHistorico()"
    [erro]="store.erroHistorico()"
    (remover)="store.remover($event)"
  />
</section>
